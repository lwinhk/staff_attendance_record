name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-production to continue
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    if: inputs.confirm == 'deploy-production' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    if: inputs.confirm == 'deploy-production' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: [api, web, worker]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image name
        id: image
        shell: bash
        run: echo "base=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.base }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.image.outputs.base }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          provenance: mode=max
          sbom: true

  deploy:
    if: inputs.confirm == 'deploy-production' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy deployment files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_DEPLOY_PATH/scripts'"
          scp -i ~/.ssh/deploy_key compose.yaml compose.deploy.yaml "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          scp -i ~/.ssh/deploy_key scripts/deploy-release.sh scripts/backup-postgres.sh "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/scripts/"
      - name: Deploy immutable release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
        shell: bash
        run: |
          image_prefix="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GHCR_READ_TOKEN" | ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "cd '$VPS_DEPLOY_PATH' && chmod 700 scripts/*.sh && IMAGE_PREFIX='$image_prefix' RELEASE_TAG='${{ github.sha }}' ./scripts/deploy-release.sh"
